<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate · SETARI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
@page{size:A4 landscape;margin:8mm}
*{box-sizing:border-box}
:root{--navy:#07376f;--teal:#1196a2;--ink:#173d48;--muted:#6d7f85;--line:#d7e3e6;--gold:#b89245}
body{margin:0;background:#edf3f4;color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.toolbar{display:flex;justify-content:center;gap:.7rem;padding:15px;position:sticky;top:0;background:rgba(237,243,244,.95);backdrop-filter:blur(8px);z-index:4}
.toolbar button,.toolbar a{border-radius:10px;padding:.78rem 1.05rem;font-weight:800;text-decoration:none;cursor:pointer;font-size:.88rem}
.toolbar button{border:0;background:#07383f;color:#fff}.toolbar a{background:#fff;color:#07383f;border:1px solid #c7d7d9}
.wrap{padding:14px}
.sheet{width:min(1120px,calc(100vw - 28px));min-height:720px;margin:auto;background:#fff;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 24px 70px rgba(7,55,111,.12);padding:44px 64px 38px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sheet:before{content:"";position:absolute;inset:14px;border:1px solid rgba(7,55,111,.22);border-radius:18px;pointer-events:none}
.sheet:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-175px;top:-190px;background:radial-gradient(circle,rgba(17,150,162,.12),rgba(17,150,162,0) 68%);pointer-events:none}
.accent{position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(180deg,var(--navy),var(--teal))}
.corner{position:absolute;right:22px;bottom:18px;width:160px;height:160px;border:1px solid rgba(17,150,162,.12);border-radius:50%;box-shadow:0 0 0 18px rgba(7,55,111,.025),0 0 0 36px rgba(17,150,162,.02)}
.logo{width:250px;max-height:76px;object-fit:contain;margin:2px auto 5px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;color:var(--teal);margin-top:10px}
.title{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.12;margin:9px 0 20px;color:#092f62;font-weight:700}
.rule{width:86px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--navy),var(--teal));margin-bottom:25px}
.body{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.72;max-width:900px;color:#284a53}
.body strong{color:#092f62}
.signatures{width:100%;display:grid;gap:80px;margin:34px auto 18px;max-width:780px}.signatures.two-signers{grid-template-columns:1fr 1fr}.signatures.one-signer{grid-template-columns:minmax(280px,420px);justify-content:center}
.signature{padding-top:0;border-top:0;font-size:12.5px;color:#3f5c63}
.signature b{display:block;font-size:14px;color:#173d48;margin-bottom:3px}
.footer-meta{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;text-align:left;padding:12px 8px 0;border-top:1px solid #e1e9eb}
.verify-copy{font-size:10px;line-height:1.55;color:#6b7c82}
.verify-copy .code{font-weight:900;letter-spacing:.07em;color:#173d48}
.qr-wrap{display:grid;justify-items:center;gap:3px}
#qr{width:88px;height:88px;padding:5px;border:1px solid #d6e2e5;border-radius:10px;background:#fff}
.qr-label{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#71858a;font-weight:800}
.loading,.error{padding:5rem;text-align:center}.error{color:#8b2f28}
@media(max-width:820px){.sheet{padding:34px 27px}.title{font-size:30px}.body{font-size:17px}.signatures{gap:24px}.footer-meta{grid-template-columns:1fr}.qr-wrap{justify-self:start}}
@media print{
 body{background:#fff}.toolbar{display:none}.wrap{padding:0}.sheet{width:100%;height:190mm;min-height:0;margin:0;border-radius:0;box-shadow:none;padding:13mm 18mm 10mm}.sheet:before{inset:5mm}.logo{width:230px}.body{font-size:18px}.title{font-size:34px}.signatures{margin-top:25px}.footer-meta{padding-top:8px}
}
</style>
<script type="module" src="assets/certificate.js?v=20261009-signers1"></script>
</head>
<body>
<div class="toolbar">
  <button id="print-btn" type="button">Print / Save as PDF</button>
  <a id="validate-link" href="validar-certificado.html">Validate certificate</a>
</div>
<div class="wrap"><div id="certificate"><div class="loading">Loading certificate…</div></div></div>
</body>
</html>
