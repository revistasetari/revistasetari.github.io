name: Fix Luiz Fernando photo

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-photo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reencode photo and bust cache
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          build = '20260824-1944'
          src = Path('assets/luiz-fernando-ribas-monteiro.jpg')
          dst = Path('assets/luiz-fernando-ribas-monteiro-v2.png')

          with Image.open(src) as im:
              im = ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((900, 1200), Image.Resampling.LANCZOS)
              im.save(dst, 'PNG', optimize=True)

          js_path = Path('assets/nilmara-guimaraes.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(r"const BUILD='[^']+';", f"const BUILD='{build}';", js, count=1)
          js = re.sub(
              r"const LUIZ_FERNANDO_PHOTO=.*?;",
              "const LUIZ_FERNANDO_PHOTO=`assets/luiz-fernando-ribas-monteiro-v2.png?v=${BUILD}`;",
              js,
              count=1,
          )
          js_path.write_text(js, encoding='utf-8')

          html_path = Path('editorial.html')
          html = html_path.read_text(encoding='utf-8')
          html = re.sub(
              r'assets/nilmara-guimaraes\.js\?v=[^"\']+',
              f'assets/nilmara-guimaraes.js?v={build}',
              html,
              count=1,
          )
          html = re.sub(
              r'<meta name="setari-build" content="[^"]+">',
              f'<meta name="setari-build" content="{build}-editorial">',
              html,
              count=1,
          )
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Remove one-off workflow
        run: rm -f .github/workflows/fix-luiz-photo.yml

      - name: Commit fix
        run: |
          git config user.name "SETARI maintenance"
          git config user.email "revistasetari@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Corrige definitivamente a foto de Luiz Fernando"
            git push
          fi
